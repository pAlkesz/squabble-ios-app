<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6470"/>
      <stop offset="1" stop-color="#D9354A"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- App-icon background (system rounds the corners; squircle shown for preview) -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- ground shadow under the receipt -->
  <ellipse cx="512" cy="758" rx="188" ry="24" fill="#000000" opacity="0.13"/>

  <!-- receipt: rounded top, zig-zag torn bottom -->
  <g filter="url(#soft)">
    <path fill="#FFFFFF" d="
      M 326 236
      L 698 236
      A 24 24 0 0 1 722 260
      L 722 720
      L 687 720 L 669.5 748 L 652 720 L 634.5 748 L 617 720 L 599.5 748
      L 582 720 L 564.5 748 L 547 720 L 529.5 748 L 512 720 L 494.5 748
      L 477 720 L 459.5 748 L 442 720 L 424.5 748 L 407 720 L 389.5 748
      L 372 720 L 354.5 748 L 337 720 L 319.5 748 L 302 720
      L 302 260
      A 24 24 0 0 1 326 236
      Z"/>
  </g>

  <!-- perforation: this bill is getting split -->
  <line x1="512" y1="250" x2="512" y2="712" stroke="#C4C9D4" stroke-width="6" stroke-linecap="round" stroke-dasharray="7 15"/>
  <circle cx="512" cy="236" r="9" fill="url(#bg)"/>

  <!-- line items (name on the left half, price on the right half) -->
  <g fill="#D3D7E0">
    <rect x="338" y="312" width="150" height="16" rx="8"/>
    <rect x="612" y="312" width="74"  height="16" rx="8"/>
    <rect x="338" y="372" width="118" height="16" rx="8"/>
    <rect x="624" y="372" width="62"  height="16" rx="8"/>
    <rect x="338" y="432" width="158" height="16" rx="8"/>
    <rect x="602" y="432" width="84"  height="16" rx="8"/>
  </g>

  <!-- total -->
  <rect x="338" y="612" width="128" height="20" rx="10" fill="#9AA0AC"/>
  <rect x="566" y="612" width="120" height="20" rx="10" fill="#E23D4C"/>

  <!-- a single nervous sweat drop -->
  <g>
    <path fill="#8FBEFF" d="
      M 700 190
      C 716 220, 728 236, 728 256
      a 30 30 0 1 1 -56 0
      C 672 236, 684 220, 700 190 Z"/>
    <ellipse cx="690" cy="250" rx="9" ry="13" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
